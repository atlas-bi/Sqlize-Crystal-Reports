name: release

on:
  push:
    branches: [master, alpha]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: cycjimmy/semantic-release-action@v4
      with:
        semantic_version: 24.2.0
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
