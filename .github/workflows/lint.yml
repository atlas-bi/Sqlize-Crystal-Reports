name: lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install ruff
      run: pip install ruff

    - name: Lint
      run: |
        ruff format --check .
        ruff check .
